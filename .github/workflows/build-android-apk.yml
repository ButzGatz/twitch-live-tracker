name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'butzgatz.png'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/de/butzgatz/supportmax android/app/src/main/res/drawable-nodpi
          echo "android.useAndroidX=true" > android/gradle.properties
          cp butzgatz.png android/app/src/main/res/drawable-nodpi/butzgatz.png
          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ButzGatzSupportMax"
          include(":app")
          EOF
          cat > android/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat > android/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "de.butzgatz.supportmax"
              compileSdk = 35
              defaultConfig {
                  applicationId = "de.butzgatz.supportmax"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.0.1"
              }
          }
          dependencies { implementation("androidx.browser:browser:1.8.0") }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="ButzGatz Support Max"
                  android:icon="@drawable/butzgatz" android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/de/butzgatz/supportmax/MainActivity.kt <<'EOF'
          package de.butzgatz.supportmax

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.TextView
          import androidx.browser.customtabs.CustomTabsIntent

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val url = Uri.parse("https://butzgatz.github.io/twitch-live-tracker/")
                  try {
                      CustomTabsIntent.Builder().setShowTitle(true).build().launchUrl(this, url)
                      finish()
                  } catch (error: Exception) {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW, url))
                          finish()
                      } catch (fallbackError: Exception) {
                          val message = TextView(this)
                          message.text = "ButzGatz Support Max konnte keinen Browser öffnen. Bitte installiere Chrome oder einen anderen Browser."
                          message.setPadding(32, 48, 32, 48)
                          setContentView(message)
                      }
                  }
              }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ButzGatz-Support-Max-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.1 android/app/build/outputs/apk/debug/app-debug.apk --title "ButzGatz Support Max für Android" --notes "Version 1.0.1 - Öffnet den Tracker in einem sicheren Chrome-Tab. Für Twitch-Anmeldung und Live-Daten ist eine Internetverbindung nötig."

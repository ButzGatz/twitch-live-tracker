name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'butzgatz.png'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/de/butzgatz/supportmax android/app/src/main/res/drawable-nodpi
          cp butzgatz.png android/app/src/main/res/drawable-nodpi/butzgatz.png
          cat > android/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ButzGatzSupportMax"
          include(":app")
          EOF
          cat > android/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat > android/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "de.butzgatz.supportmax"
              compileSdk = 35
              defaultConfig {
                  applicationId = "de.butzgatz.supportmax"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:label="ButzGatz Support Max"
                  android:icon="@drawable/butzgatz" android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/de/butzgatz/supportmax/MainActivity.kt <<'EOF'
          package de.butzgatz.supportmax

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.os.Message
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var webView: WebView
              private val startUrl = "https://butzgatz.github.io/twitch-live-tracker/"
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(14,14,16)
                  window.navigationBarColor = Color.rgb(14,14,16)
                  webView = WebView(this)
                  webView.settings.javaScriptEnabled = true
                  webView.settings.domStorageEnabled = true
                  webView.settings.javaScriptCanOpenWindowsAutomatically = true
                  webView.settings.setSupportMultipleWindows(true)
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true)
                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                          val uri = request?.url ?: return false
                          val host = uri.host ?: return false
                          return if (host == "butzgatz.github.io" || host == "id.twitch.tv" ||
                              host == "api.twitch.tv" || host == "twitch.tv" || host.endsWith(".twitch.tv")) false
                          else {
                              try { startActivity(Intent(Intent.ACTION_VIEW, uri)); true }
                              catch (_: Exception) { true }
                          }
                      }
                  }
                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onCreateWindow(view: WebView?, isDialog: Boolean, isUserGesture: Boolean,
                                                  resultMsg: Message?): Boolean {
                          val popup = WebView(this@MainActivity)
                          popup.webViewClient = object : WebViewClient() {
                              override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {
                                  val uri = request?.url ?: return false
                                  return try { startActivity(Intent(Intent.ACTION_VIEW, uri)); true }
                                  catch (_: Exception) { true }
                              }
                          }
                          val transport = resultMsg?.obj as? WebView.WebViewTransport ?: return false
                          transport.webView = popup
                          resultMsg.sendToTarget()
                          return true
                      }
                  }
                  setContentView(webView)
                  webView.loadUrl(startUrl)
              }
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) webView.goBack() else super.onBackPressed()
              }
          }
          EOF
      - name: Build APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ButzGatz-Support-Max-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk --title "ButzGatz Support Max für Android" --notes "Direkt installierbare Android-APK. Für Twitch-Anmeldung und Live-Daten ist eine Internetverbindung nötig."
